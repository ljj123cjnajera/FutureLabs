<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PRIMARY SOURCE OF TRUTH - LOAD ORDER MATTERS -->
    <link rel="stylesheet" href="css/typography.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/home-streetwear.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/autocomplete.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/header-v3.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/auth-brutalist.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/notifications.css?v=7.0-CLEAN">

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <div class="recovery-page">
        <div class="recovery-container">
            <div class="recovery-header">
                <h1><i class="fas fa-key"></i> Recuperar Contraseña</h1>
                <p>Ingresa tu email para recibir instrucciones</p>
            </div>

            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i>
                Si el email existe, recibirás instrucciones para recuperar tu contraseña
            </div>

            <form id="recoveryForm">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" required autofocus placeholder="tu@email.com">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Enviar Instrucciones
                </button>
            </form>

            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
            </div>
        </div>
    </div>

    <footer id="mainFooter"></footer>

    <!-- Scripts -->
    <!-- Core scripts (critical for page functionality) -->
    <script src="js/logger.js?v=1.0"></script>
    <script src="js/error-handler.js?v=1.0"></script>
    <script src="js/loading-states.js?v=1.0"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/navigation-enhanced.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>

</body>
