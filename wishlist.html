<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Wishlist - SneakersShop</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS Unificado (Streetwear Standard V3) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/account-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">

    <!-- CSS Específicos de Página -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/profile-wishlist-orders.css?v=REVAMP">
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <!-- Account Layout (Sidebar + Content) -->
    <div class="account-container">
        <!-- SIDEBAR (Shared Global Nav) -->
        <aside class="account-sidebar">
            <div class="account-user-info">
                <div class="account-user-name" id="profileName">LOADING...</div>
                <div class="account-user-email" id="profileEmail">...</div>
            </div>

            <nav class="account-nav">
                <button class="account-nav-btn" onclick="window.location.href='profile.html'">
                    <i class="fas fa-th-large"></i> OVERVIEW
                </button>
                <button class="account-nav-btn" onclick="window.location.href='orders.html'">
                    <i class="fas fa-box"></i> ORDERS
                </button>
                <button class="account-nav-btn" onclick="window.location.href='profile.html?tab=addresses'">
                    <i class="fas fa-map-marker-alt"></i> ADDRESSES
                </button>
                <button class="account-nav-btn active" onclick="window.location.href='wishlist.html'">
                    <i class="fas fa-heart"></i> WISHLIST
                </button>
                <button class="account-nav-btn" onclick="window.location.href='profile.html?tab=settings'">
                    SETTINGS
                </button>
                <button class="account-nav-btn" onclick="window.authManager.logout()"
                    style="margin-top: 2rem; color: red; border-color: red;">
                    LOGOUT
                </button>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="account-content">
            <div class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">My Wishlist</h1>
                    <p class="dashboard-subtitle">Save your grails. Organize your drops.</p>
                </div>
            </div>

            <!-- Inner Layout: Content + List Management Sidebar -->
            <div class="wishlist-layout" style="display: flex; gap: 2rem; align-items: flex-start; margin-top: 2rem;">

                <!-- Wishlist Internal Sidebar (List Management) -->
                <aside class="wishlist-sidebar"
                    style="flex: 0 0 280px; background: #f8f8f8; padding: 1.5rem; border: 1px solid #ddd;">
                    <div class="wishlist-lists-header" style="margin-bottom: 1.5rem;">
                        <div style="margin-bottom: 1rem;">
                            <h2 style="font-size: 1.2rem; font-weight: 800; text-transform: uppercase;">Mis listas</h2>
                        </div>
                        <button class="btn btn-outline btn-sm" id="createWishlistBtn"
                            style="width: 100%; justify-content: center;">
                            <i class="fas fa-plus"></i> Nueva lista
                        </button>
                    </div>
                    <ul class="wishlist-lists" id="wishlistLists" style="list-style: none; padding: 0; margin: 0;">
                        <li class="wishlist-list-placeholder">Cargando listas...</li>
                    </ul>
                    <div class="wishlist-sidebar-footer"
                        style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #ddd;">
                        <button class="btn btn-ghost btn-sm" id="shareListBtn" style="width: 100%;">
                            <i class="fas fa-share-alt"></i> Compartir lista
                        </button>
                    </div>
                </aside>

                <!-- Wishlist Items Grid -->
                <section class="wishlist-content" aria-labelledby="wishlist-content-title" style="flex: 1;">
                    <h2 id="wishlist-content-title" class="sr-only">Contenido de la wishlist</h2>

                    <!-- Stats Bar -->
                    <div class="wishlist-stats" role="group"
                        style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem;">
                        <div class="wishlist-stat-card"
                            style="border: 1px solid #eee; padding: 1rem; text-align: center;">
                            <div class="wishlist-stat-value" id="wishlistCount"
                                style="font-size: 1.5rem; font-weight: 800;">0</div>
                            <div class="wishlist-stat-label"
                                style="font-size: 0.8rem; text-transform: uppercase; color: #666;">Guardados</div>
                        </div>
                        <div class="wishlist-stat-card"
                            style="border: 1px solid #eee; padding: 1rem; text-align: center;">
                            <div class="wishlist-stat-value" id="onSaleCount"
                                style="font-size: 1.5rem; font-weight: 800; color: red;">0</div>
                            <div class="wishlist-stat-label"
                                style="font-size: 0.8rem; text-transform: uppercase; color: #666;">En oferta</div>
                        </div>
                        <div class="wishlist-stat-card"
                            style="border: 1px solid #eee; padding: 1rem; text-align: center;">
                            <div class="wishlist-stat-value" id="listCount"
                                style="font-size: 1.5rem; font-weight: 800;">0</div>
                            <div class="wishlist-stat-label"
                                style="font-size: 0.8rem; text-transform: uppercase; color: #666;">Listas</div>
                        </div>
                    </div>

                    <!-- Toolbar -->
                    <div class="wishlist-toolbar"
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #000;">
                        <div class="wishlist-toolbar-info">
                            <h2 id="activeListName" style="font-size: 1.5rem; font-weight: 800; margin: 0;">Lista
                                principal</h2>
                            <span id="activeListCount" class="wishlist-toolbar-count" style="color: #666;">0
                                productos</span>
                        </div>
                        <div class="wishlist-toolbar-actions" style="display: flex; gap: 1rem; align-items: center;">
                            <div class="wishlist-filters">
                                <button class="wishlist-filter-btn active" data-filter="all">Todos</button>
                                <button class="wishlist-filter-btn" data-filter="on-sale">Ofertas</button>
                            </div>
                            <button class="btn btn-light btn-sm" id="clearListBtn">
                                <i class="fas fa-trash-alt"></i> Vaciar
                            </button>
                        </div>
                    </div>

                    <!-- Selection & Grid -->
                    <div id="wishlistContainer" class="wishlist-container" role="region" aria-live="polite">
                        <div class="wishlist-empty-state loading">
                            <div class="loading-spinner"></div>
                            <p>Cargando wishlist...</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modals (Create List) -->
    <div id="wishlistListModal" class="modal modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="wishlistListModalTitle">
                    <i class="fas fa-list-ul"></i>
                    Nueva lista
                </h3>
                <button class="modal-close" type="button" data-modal-close>&times;</button>
            </div>
            <form id="wishlistListForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="wishlistListName">Nombre de la lista</label>
                        <input type="text" id="wishlistListName" class="form-input" placeholder="Ej. Regalos de Navidad"
                            maxlength="80" required>
                    </div>
                    <div class="form-group">
                        <label for="wishlistListDescription">Descripción (opcional)</label>
                        <textarea id="wishlistListDescription" class="form-textarea" rows="3" maxlength="180"
                            placeholder="Describe qué productos guardarás aquí"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="wishlistListSubmit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/components.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Load User Info
            if (window.authManager && window.authManager.isAuthenticated()) {
                const user = window.authManager.currentUser;
                if (user) {
                    document.getElementById('profileName').textContent = user.name || 'User';
                    document.getElementById('profileEmail').textContent = user.email || '';
                }
            }
        });

        // RE-INJECTED LOGIC FROM ORIGINAL FILE
        (function () {
            const state = {
                filter: 'all',
                pendingListId: new URLSearchParams(window.location.search).get('list'),
                processingBulk: false
            };

            const elements = {
                headerContainer: document.getElementById('mainHeader'),
                listsContainer: document.getElementById('wishlistLists'),
                statsProducts: document.getElementById('wishlistCount'),
                statsOnSale: document.getElementById('onSaleCount'),
                statsLists: document.getElementById('listCount'),
                activeListName: document.getElementById('activeListName'),
                activeListCount: document.getElementById('activeListCount'),
                container: document.getElementById('wishlistContainer'),
                createListBtn: document.getElementById('createWishlistBtn'),
                shareListBtn: document.getElementById('shareListBtn'),
                filterButtons: Array.from(document.querySelectorAll('.wishlist-filter-btn')),
                selectionBar: document.getElementById('wishlistSelectionBar'),
                selectedCountLabel: document.getElementById('selectedCountLabel'),
                selectAllBtn: document.getElementById('selectAllBtn'),
                moveTargetSelect: document.getElementById('moveTargetSelect'),
                moveSelectedBtn: document.getElementById('moveSelectedBtn'),
                cartSelectedBtn: document.getElementById('cartSelectedBtn'),
                deleteSelectedBtn: document.getElementById('deleteSelectedBtn'),
                clearListBtn: document.getElementById('clearListBtn'),
                listModal: document.getElementById('wishlistListModal'),
                listForm: document.getElementById('wishlistListForm'),
                listModalTitle: document.getElementById('wishlistListModalTitle'),
                listNameInput: document.getElementById('wishlistListName'),
                listDescriptionInput: document.getElementById('wishlistListDescription'),
                listSubmitButton: document.getElementById('wishlistListSubmit')
            };

            const modalState = {
                mode: 'create',
                listId: null
            };

            document.addEventListener('DOMContentLoaded', () => {
                initHeader();
                setupListeners();

                if (window.authManager?.isAuthenticated()) {
                    renderLoading();
                } else {
                    renderAuthRequired();
                }
            });

            function initHeader() {
                const { headerContainer } = elements;
                if (headerContainer && window.Components) {
                    headerContainer.innerHTML = window.Components.getHeader(true, true);
                    window.Components.initHeader();
                    window.Components.initSearch();
                    window.Components.initCartCounter();
                }
            }

            function setupListeners() {
                elements.createListBtn?.addEventListener('click', () => openListModal('create'));
                elements.shareListBtn?.addEventListener('click', shareActiveList);
                elements.clearListBtn?.addEventListener('click', handleClearActiveList);

                elements.filterButtons.forEach((btn) => {
                    btn.addEventListener('click', handleFilterChange);
                });

                elements.listsContainer?.addEventListener('click', handleListClick);

                elements.container?.addEventListener('click', handleContainerClick);
                elements.container?.addEventListener('change', handleContainerChange);

                elements.selectAllBtn?.addEventListener('click', handleSelectAll);
                elements.moveSelectedBtn?.addEventListener('click', handleMoveSelected);
                elements.cartSelectedBtn?.addEventListener('click', handleCartSelected);
                elements.deleteSelectedBtn?.addEventListener('click', handleDeleteSelected);

                elements.listForm?.addEventListener('submit', handleListFormSubmit);

                elements.listModal?.querySelectorAll('[data-modal-close]')?.forEach((btn) => {
                    btn.addEventListener('click', closeListModal);
                });
                elements.listModal?.addEventListener('click', (event) => {
                    if (event.target === elements.listModal) {
                        closeListModal();
                    }
                });

                window.addEventListener('wishlistUpdated', handleWishlistUpdated);
                window.addEventListener('wishlistSelectionChanged', handleSelectionChanged);

                if (window.authManager) {
                    window.authManager.addEventListener('authStateChanged', async () => {
                        if (window.authManager.isAuthenticated()) {
                            renderLoading();
                            await window.wishlistManager.init();
                        } else {
                            renderAuthRequired();
                        }
                    });
                }
            }

            function handleWishlistUpdated(event) {
                const lists = event.detail?.lists || window.wishlistManager?.lists || [];
                const activeListId = event.detail?.activeListId || window.wishlistManager?.activeListId || null;

                renderLists(lists, activeListId);
                renderStats(lists);
                renderItems();
                updateMoveTargetOptions(lists, activeListId);
                updateShareButton();

                if (state.pendingListId) {
                    const pendingExists = window.wishlistManager?.getListById?.(state.pendingListId);
                    if (pendingExists && window.wishlistManager.activeListId !== state.pendingListId) {
                        window.wishlistManager.setActiveList(state.pendingListId);
                    }
                    state.pendingListId = null;
                }
            }

            function handleSelectionChanged(event) {
                const totalSelected = event.detail?.totalSelected || 0;
                if (!elements.selectionBar) return;

                if (totalSelected > 0) {
                    elements.selectionBar.hidden = false;
                    elements.selectedCountLabel.textContent = `${totalSelected} ${totalSelected === 1 ? 'producto seleccionado' : 'productos seleccionados'}`;
                } else {
                    elements.selectionBar.hidden = true;
                }

                updateBulkActions();
            }

            function renderLists(lists, activeListId) {
                if (!elements.listsContainer) return;

                if (!lists.length) {
                    elements.listsContainer.innerHTML = `
                        <li class="wishlist-list-placeholder">
                            Crea tu primera lista para guardar favoritos personalizados.
                        </li>
                    `;
                    return;
                }

                elements.listsContainer.innerHTML = lists.map((list) => `
                    <li class="wishlist-list-item ${list.id === activeListId ? 'is-active' : ''}" data-list-id="${list.id}" style="padding: 0.5rem; margin-bottom: 0.5rem; border-bottom: 1px solid #eee; cursor: pointer;">
                        <div class="wishlist-list-main" data-action="activate" style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="wishlist-list-name" style="font-weight: 600;">${escapeHTML(list.name)}</span>
                            <span class="wishlist-list-count" style="font-size: 0.8rem; color: #888;">${list.items?.length || 0}</span>
                        </div>
                        <div class="wishlist-list-actions" style="margin-top: 5px; font-size: 0.8rem;">
                            ${list.is_default ? '<span class="wishlist-list-badge" style="background:#000; color:#fff; padding: 2px 5px; font-size: 10px;">MAIN</span>' : ''}
                            <button class="btn-icon" data-action="delete" title="Eliminar lista" type="button" style="float: right; color: red; border: none; background: none;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </li>
                `).join('');
            }

            function renderStats(lists) {
                const products = lists.reduce((acc, list) => acc + (list.items?.length || 0), 0);
                const onSale = lists.reduce((acc, list) => acc + (list.items?.filter(item => item.discount_price)?.length || 0), 0);

                if (elements.statsProducts) elements.statsProducts.textContent = products;
                if (elements.statsOnSale) elements.statsOnSale.textContent = onSale;
                if (elements.statsLists) elements.statsLists.textContent = lists.length;
            }

            function renderItems() {
                const manager = window.wishlistManager;
                if (!manager || !elements.container) return;

                if (!window.authManager?.isAuthenticated()) {
                    renderAuthRequired();
                    return;
                }

                const activeList = manager.getActiveList();

                if (!activeList) {
                    elements.container.innerHTML = `
                        <div class="wishlist-empty-state">
                            <i class="far fa-heart"></i>
                            <h2>Aún no tienes listas activas</h2>
                            <button class="btn btn-primary btn-sm" onclick="document.getElementById('createWishlistBtn').click()">
                                <i class="fas fa-plus"></i> Crear lista
                            </button>
                        </div>
                    `;
                    return;
                }

                const items = Array.isArray(activeList.items) ? activeList.items : [];

                if (elements.activeListName) elements.activeListName.textContent = activeList.name;
                if (elements.activeListCount) elements.activeListCount.textContent = `${items.length} items`;

                const filteredItems = applyFilter(items, state.filter);

                if (manager.isLoading && !items.length) {
                    renderLoading();
                    return;
                }

                if (!filteredItems.length) {
                    elements.container.innerHTML = `
                        <div class="wishlist-empty-state" style="padding: 2rem; text-align: center;">
                            <p>Lista vacía.</p>
                            <button class="btn btn-outline btn-sm" onclick="window.location.href='products.html'">
                                <i class="fas fa-search"></i> Buscar productos
                            </button>
                        </div>
                    `;
                    return;
                }

                elements.container.setAttribute('aria-busy', 'false');
                elements.container.innerHTML = `
                    <div class="wishlist-grid" role="list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;">
                        ${filteredItems.map((item, index) => renderWishlistCard(item, manager.selectedItems?.has(item.product_id), index)).join('')}
                    </div>
                `;
            }

            function renderWishlistCard(item, isSelected, index) {
                const hasDiscount = Boolean(item.discount_price);
                const productName = escapeHTML(item.product_name || 'Producto SneakersShop');

                return `
                    <article class="wishlist-item" style="border: 1px solid #eee; padding: 1rem; position: relative;">
                         <button class="btn-icon" data-product-action="remove" data-product-id="${item.product_id}" style="position: absolute; top: 5px; right: 5px; color: red; border: none; background: none;">
                            <i class="fas fa-times"></i>
                        </button>
                        <div class="wishlist-item-media" style="margin-bottom: 1rem;">
                            <img src="${item.image_url || 'https://via.placeholder.com/480x480?text=SneakersShop'}" alt="${productName}" style="width: 100%; height: auto;">
                        </div>
                        <div class="wishlist-item-body">
                            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem;">${productName}</h3>
                             <div class="wishlist-item-price" style="font-weight: 800;">
                                ${hasDiscount ? `<span style="text-decoration: line-through; color: #999; font-size: 0.8em;">S/ ${Number(item.price).toFixed(2)}</span> <span style="color: red;">S/ ${Number(item.discount_price).toFixed(2)}</span>` : `S/ ${Number(item.price).toFixed(2)}`}
                            </div>
                            <button class="btn btn-primary btn-sm" data-product-action="cart" data-product-id="${item.product_id}" style="width: 100%; margin-top: 1rem;">
                                Agregar al Carrito
                            </button>
                        </div>
                    </article>
                `;
            }

            function renderLoading() {
                if (!elements.container) return;
                window.loadingState.renderLoading(elements.container, 'Cargando wishlist...', {
                    className: 'wishlist-empty-state loading'
                });
            }

            function renderAuthRequired() {
                if (!elements.container) return;
                elements.container.innerHTML = `
                        <div class="wishlist-empty-state" style="padding: 3rem; text-align: center;">
                            <i class="fas fa-lock" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                            <h2>Inicia sesión</h2>
                            <p>Necesitas estar autenticado.</p>
                            <button class="btn btn-primary btn-sm" onclick="window.modalManager?.showLogin?.()">
                                Iniciar sesión
                            </button>
                        </div>
                    `;
            }

            function updateMoveTargetOptions(lists, activeListId) {
                if (!elements.moveTargetSelect) return;
                const otherLists = lists.filter(list => list.id !== activeListId);
                elements.moveTargetSelect.innerHTML = '<option value="">Mover a...</option>';
                otherLists.forEach((list) => {
                    const option = document.createElement('option');
                    option.value = list.id;
                    option.textContent = list.name;
                    elements.moveTargetSelect.appendChild(option);
                });
                elements.moveTargetSelect.disabled = otherLists.length === 0;
            }

            function updateShareButton() {
                if (!elements.shareListBtn) return;
                const hasList = !!window.wishlistManager?.getActiveList?.();
                elements.shareListBtn.disabled = !hasList;
            }

            function handleFilterChange(event) {
                const button = event.currentTarget;
                state.filter = button.dataset.filter;
                elements.filterButtons.forEach((btn) => btn.classList.remove('active'));
                button.classList.add('active');
                renderItems();
            }

            function handleListClick(event) {
                const listItem = event.target.closest('.wishlist-list-item');
                if (!listItem) return;
                const listId = listItem.dataset.listId;
                const actionBtn = event.target.closest('[data-action]');

                if (actionBtn && actionBtn.dataset.action === 'delete') {
                    confirmDeleteList(listId);
                } else {
                    window.wishlistManager?.setActiveList?.(listId);
                }
            }

            function handleContainerClick(event) {
                const actionBtn = event.target.closest('[data-product-action]');
                if (!actionBtn) return;
                const productId = actionBtn.dataset.productId;
                const action = actionBtn.dataset.productAction;
                const listId = window.wishlistManager?.activeListId || null;

                if (action === 'cart') window.wishlistManager?.moveToCart?.(productId, { listId });
                if (action === 'remove') window.wishlistManager?.remove?.(productId, { listId });
            }

            function handleContainerChange(event) { } // Stub
            function handleSelectAll() { } // Stub
            function handleMoveSelected() { } // Stub
            function handleCartSelected() { } // Stub
            function handleDeleteSelected() { } // Stub

            function openListModal(mode, listId = null) {
                modalState.mode = mode;
                modalState.listId = listId;
                elements.listModal?.classList.add('active');
            }

            function closeListModal() {
                elements.listModal?.classList.remove('active');
                elements.listForm?.reset();
            }

            async function handleListFormSubmit(event) {
                event.preventDefault();
                const name = elements.listNameInput?.value.trim();
                const description = elements.listDescriptionInput?.value.trim();
                if (!name) return;

                elements.listSubmitButton.disabled = true;
                try {
                    await window.wishlistManager?.createList?.(name, description);
                    closeListModal();
                } catch (error) {
                    console.error('Error saving list:', error);
                } finally {
                    elements.listSubmitButton.disabled = false;
                }
            }

            function confirmDeleteList(listId) {
                const list = window.wishlistManager?.getListById?.(listId);
                if (!list) return;
                if (confirm('¿Eliminar lista?')) window.wishlistManager?.deleteList?.(listId);
            }

            function handleClearActiveList() {
                const manager = window.wishlistManager;
                const activeList = manager?.getActiveList?.();
                if (activeList && confirm('¿Vaciar lista?')) manager.clear(activeList.id);
            }

            async function shareActiveList() {
                const manager = window.wishlistManager;
                const list = manager?.getActiveList?.();
                if (!list) return;
                const url = window.location.href;
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(url);
                    alert('Enlace copiado!');
                }
            }

            function applyFilter(items, filter) {
                if (filter === 'on-sale') return items.filter(item => item.discount_price);
                return items;
            }

            function escapeHTML(value = '') {
                return value.replace(/[&<>"'`]/g, '');
            }
        })();
    </script>
</body>

</html>
