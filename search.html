<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Búsqueda - SneakersShop</title>
    <meta name="description" content="Busca tus zapatillas favoritas en SneakersShop. Encuentra los mejores pares de Nike, Jordan, Adidas y más.">

    <!-- PRIMARY SOURCE OF TRUTH - LOAD ORDER MATTERS -->
    <link rel="stylesheet" href="css/typography.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/home-streetwear.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/autocomplete.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/header-v3.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/product-cards.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/products-streetwear.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/animations.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/notifications.css?v=8.0-URGENT">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Poppins:wght@900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .search-results-header {
            padding: 140px 0 60px;
            text-align: center;
            border-bottom: 2px solid var(--black);
            background: var(--white);
        }

        .search-query-display {
            font-family: 'Koulen', sans-serif;
            font-size: 5rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .search-count {
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            color: #666;
            margin-bottom: 40px;
        }

        .search-filters-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 2px solid var(--black);
            background: var(--gray-100);
        }

        .grid-container {
            padding: 60px 40px;
            min-height: 60vh;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
        }

        /* Brutalist Card Override */
        .product-card {
            border: 2px solid var(--black);
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 4px 4px 0 var(--black);
        }

        .empty-search {
            text-align: center;
            padding: 100px 0;
        }

        .empty-search i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #ccc;
        }
    </style>
</head>

<body class="loading">

    <!-- Header -->
    <header id="mainHeader"></header>

    <!-- Search Header -->
    <div class="search-results-header">
        <div class="container">
            <h1 class="search-query-display" id="searchTitle">BUSCANDO...</h1>
            <div class="search-count" id="resultsCount">Cargando catálogo...</div>

            <div style="max-width: 600px; margin: 0 auto;">
                <form id="refineSearchForm" style="display: flex; gap: 0; border: 2px solid black;" aria-label="Formulario de búsqueda">
                    <input type="text" id="refineInput" placeholder="INTRODUCE UNA PALABRA CLAVE..."
                        style="flex: 1; border: none; padding: 15px; font-family: 'Space Grotesk'; font-size: 1.1rem; text-transform: uppercase;" aria-label="Buscar productos">
                    <button type="submit"
                        style="border: none; border-left: 2px solid black; background: black; color: white; padding: 0 30px; cursor: pointer; font-family: 'Koulen'; font-size: 1.2rem;"
                        aria-label="Buscar">
                        BUSCAR
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="search-filters-bar">
        <div class="filter-group">
            <span style="font-weight: 700; margin-right: 15px;">ORDENAR POR:</span>
            <select id="sortSelect"
                style="border: 2px solid black; padding: 5px 10px; font-family: 'Space Grotesk'; font-weight: 600; text-transform: uppercase;" aria-label="Ordenar resultados">
                <option value="newest">MÁS RECIENTES</option>
                <option value="price_asc">PRECIO: MENOR A MAYOR</option>
                <option value="price_desc">PRECIO: MAYOR A MENOR</option>
                <option value="name_asc">ALFABÉTICO (A-Z)</option>
            </select>
        </div>
        <div class="view-toggle">
            <span id="itemsShowing">Mostrando 0 resultados</span>
        </div>
    </div>

    <!-- Results Grid -->
    <main class="grid-container">
        <div id="searchResultsGrid" class="product-grid">
            <!-- Products injected here -->
        </div>
    </main>

    <!-- Footer -->
    <footer id="mainFooter" class="footer"></footer>

    <!-- Scripts -->
    <!-- Core scripts (critical for page functionality) -->
    <script src="js/logger.js?v=1.0"></script>
    <script src="js/error-handler.js?v=1.0"></script>
    <script src="js/loading-states.js?v=1.0"></script>
    <script src="js/api.js?v=8.0-CLEAN"></script>
    <script src="js/components.js?v=8.0-CLEAN"></script>
    <script src="js/navigation-enhanced.js?v=8.0-CLEAN"></script>
    <script src="js/auth.js?v=8.0-CLEAN"></script>
    <script src="js/cart.js?v=8.0-CLEAN"></script>
    <script src="js/wishlist.js?v=8.0-CLEAN"></script>
    <script src="js/notifications.js?v=8.0-CLEAN"></script>
    <!-- Page-specific script -->
    <script src="js/search.js?v=8.0-CLEAN"></script>
</body>

</html>
