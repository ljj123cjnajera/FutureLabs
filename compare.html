<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar Productos - SneakersShop</title>
    <meta name="description" content="Compara productos lado a lado para encontrar el mejor par de zapatillas para ti.">
    <meta name="robots" content="index, follow">

    <!-- CSS Unificado (V7) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/comparator.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/animations.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/notifications.css?v=7.0-CLEAN">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Header -->
    <header id="mainHeader"></header>

    <!-- Breadcrumbs -->
    <nav aria-label="Breadcrumb" id="breadcrumbs"></nav>

    <!-- Main Content -->
    <main class="compare-page">
        <div class="container">
            <div class="compare-header">
                <h1 class="page-title">COMPARAR PRODUCTOS</h1>
                <p class="page-description">Compara hasta 3 productos lado a lado para tomar la mejor decisión</p>
                <button class="btn btn-outline" onclick="window.productComparator.clear()" id="clearCompareBtn">
                    <i class="fas fa-trash"></i> LIMPIAR COMPARACIÓN
                </button>
            </div>

            <!-- Compare Container -->
            <div id="compareContainer" class="compare-container">
                <!-- Products will be injected here by JS -->
                <div class="compare-empty-state" id="compareEmptyState">
                    <i class="fas fa-balance-scale" style="font-size: 64px; color: #ccc; margin-bottom: 20px;"></i>
                    <h2>No hay productos para comparar</h2>
                    <p>Agrega productos desde el catálogo usando el botón de comparar</p>
                    <a href="products.html" class="btn btn-black">
                        <i class="fas fa-shopping-bag"></i> EXPLORAR PRODUCTOS
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="mainFooter"></footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/components.js"></script>
    <script src="js/breadcrumbs.js"></script>
    <script src="js/comparator.js"></script>
    <script src="js/compare-page.js"></script>
</body>

</html>
