<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Catálogo Exclusivo - SneakersShop">
    <meta name="twitter:description"
        content="Encuentra tu par perfecto. La mejor selección de sneakers originales en Perú.">
    <meta name="twitter:image" content="https://ljj123cjnajera.github.io/FutureLabs/assets/images/banners/hero-banner.jpg">

    <!-- Canonical -->
    <link rel="canonical" href="https://ljj123cjnajera.github.io/FutureLabs/products.html">
    
    <!-- Preload Critical Resources -->
    <link rel="dns-prefetch" href="https://futurelabs-production.up.railway.app">
    <!-- Google Fonts - Fuentes Profesionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CSS Unificado (Streetwear Standard V3) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/product-cards.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/skeleton.css?v=7.0-CLEAN">

    <!-- Utilities -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Page Specific -->
    <link rel="stylesheet" href="css/products-streetwear.css?v=7.0-CLEAN">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Catálogo de Productos - SneakersShop",
      "description": "Explora nuestra colección exclusiva de sneakers y streetwear",
      "url": "https://ljj123cjnajera.github.io/FutureLabs/products.html",
      "mainEntity": {
        "@type": "ItemList",
        "itemListElement": []
      }
    }
    </script>
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader" role="banner"></header>

    <!-- Breadcrumbs -->
    <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>

    <!-- 🚀 V3 CATALOG: BRUTALIST ENGINE -->
    <main id="main-content" class="products-page">
        <!-- Brutalist Header -->
        <div class="container"
            style="margin-top: 4rem; margin-bottom: 2rem; border-bottom: 4px solid var(--black); padding-bottom: 1rem;">
            <div class="d-flex justify-content-between align-items-end flex-wrap gap-4">
                <div>
                    <span class="text-uppercase fw-bold" style="letter-spacing: 2px;">Catálogo v3.0</span>
                    <h1
                        style="font-size: 4rem; line-height: 0.9; margin: 0; text-transform: uppercase; font-weight: 900;">
                        ACCESO TOTAL</h1>
                </div>
                <div class="catalog-stats fw-bold" aria-live="polite" aria-atomic="true">
                    <span id="productCount">0</span> PRODUCTOS CARGADOS
                </div>
            </div>
        </div>

        <div class="container">
            <!-- Search Bar -->
            <div class="catalog-search" style="margin-bottom: 2rem;">
                <div class="search-container" style="position: relative; max-width: 600px; margin: 0 auto;">
                    <input type="text" 
                           id="productSearchInput" 
                           class="brutalist-search-input" 
                           placeholder="BUSCAR PRODUCTOS..." 
                           aria-label="Buscar productos"
                           style="width: 100%; padding: 1rem 3rem 1rem 1rem; border: 3px solid var(--black); font-size: 1rem; font-weight: 700;">
                    <button type="button" 
                            onclick="window.catalogEngine.search(document.getElementById('productSearchInput').value)"
                            class="search-submit-btn"
                            aria-label="Buscar"
                            style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: var(--black); color: var(--white); border: none; padding: 0.75rem 1.5rem; cursor: pointer; font-weight: 900;">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <!-- V3 Controls -->
            <div class="catalog-controls"
                style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; border: 2px solid var(--black); padding: 1rem;"
                role="toolbar" aria-label="Filtros y ordenamiento de productos">
                <div class="filter-group" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn-filter active" onclick="window.catalogEngine.filter('all')" aria-pressed="true" aria-label="Mostrar todos los productos">TODOS</button>
                    <button class="btn-filter" onclick="window.catalogEngine.filter('jordan')" aria-pressed="false" aria-label="Filtrar productos Jordan">JORDAN</button>
                    <button class="btn-filter" onclick="window.catalogEngine.filter('yeezy')" aria-pressed="false" aria-label="Filtrar productos Yeezy">YEEZY</button>
                    <button class="btn-filter" onclick="window.catalogEngine.filter('nike')" aria-pressed="false" aria-label="Filtrar productos Nike">NIKE</button>
                    <button class="btn-filter" onclick="window.catalogEngine.filter('adidas')" aria-pressed="false" aria-label="Filtrar productos Adidas">ADIDAS</button>
                    <button class="btn-filter" onclick="window.catalogEngine.toggleSaleFilter()" aria-pressed="false" aria-label="Mostrar solo ofertas">OFERTAS</button>
                </div>
                <div style="margin-left: auto; display: flex; gap: 1rem; align-items: center;">
                    <label for="sortSelect" class="sr-only">Ordenar productos por</label>
                    <select id="sortSelect" class="brutalist-select" onchange="window.catalogEngine.sort(this.value)" aria-label="Ordenar productos" style="padding: 0.75rem; border: 2px solid var(--black); font-weight: 700; background: var(--white);">
                        <option value="newest">ÚLTIMO LANZAMIENTO</option>
                        <option value="price-asc">PRECIO: MENOR A MAYOR</option>
                        <option value="price-desc">PRECIO: MAYOR A MENOR</option>
                        <option value="name-asc">NOMBRE: A-Z</option>
                        <option value="name-desc">NOMBRE: Z-A</option>
                    </select>
                    <button class="btn btn-outline" onclick="window.catalogEngine.clearFilters()" aria-label="Limpiar filtros" style="padding: 0.75rem 1.5rem; font-weight: 700;">
                        <i class="fas fa-times"></i> LIMPIAR
                    </button>
                </div>
            </div>

            <!-- V3 Grid -->
            <div id="productsContainer" class="product-grid-v3"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; min-height: 50vh;"
                role="region" aria-label="Lista de productos" aria-live="polite">
                <!-- Injected by CatalogEngine -->
                <div class="loading-brutalist" aria-label="Cargando productos">LOADING DATA...</div>
            </div>

            <!-- Pagination (Real Implementation) -->
            <nav class="pagination-brutalist"
                style="margin-top: 4rem; display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;"
                aria-label="Navegación de páginas">
                <!-- Will be populated by JavaScript -->
            </nav>
        </div>
    </main>

    <section id="recentlyViewedProductsSection" class="recently-viewed-section" data-recently-viewed-section
        style="display:none;" aria-labelledby="recently-viewed-title">
        <div class="container">
            <div class="section-header">
                <h2 id="recently-viewed-title"><i class="fas fa-history" aria-hidden="true"></i> Tu historial de productos</h2>
                <button type="button" class="recently-viewed-clear" id="clearRecentlyViewedProductsBtn" aria-label="Limpiar historial de productos vistos">
                    <i class="fas fa-times" aria-hidden="true"></i> Limpiar historial
                </button>
            </div>
            <div id="recentlyViewedGridProducts" class="recently-viewed-grid"
                data-section="#recentlyViewedProductsSection" role="region" aria-label="Productos vistos recientemente"></div>
        </div>
    </section>

    <!-- Footer (Will be injected by JS) -->
    <footer id="mainFooter" role="contentinfo"></footer>

    <!-- Scripts del Sistema Integrado -->
    <!-- Core scripts (critical for page functionality) -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/navigation-enhanced.js"></script> <!-- Vital for Header/Footer -->
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/cart.js"></script>
    
    <!-- Page-specific script (deferred for better performance) -->

    <!-- Catalog Engine -->
    <script src="js/products.js" defer></script>

    <!-- Logic moved to js/products.js -->
</body>

</html>
