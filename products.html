<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - SneakersShop</title>
    <!-- Google Fonts - Fuentes Profesionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        <!-- Estilos inline removidos - migrados a products-page.css -->

    <!-- CSS Unificado (Streetwear Standard) -->
    <link rel="stylesheet" href="css/typography.css?v=3.0">
    <link rel="stylesheet" href="css/style.css?v=3.0">
    <link rel="stylesheet" href="css/design-system.css?v=3.0">
    <link rel="stylesheet" href="css/header-improved.css?v=3.0">
    <link rel="stylesheet" href="css/footer-improved.css?v=3.0">
    <link rel="stylesheet" href="css/forms-improved.css?v=3.0">
    <link rel="stylesheet" href="css/modals-improved.css?v=3.0">
    <link rel="stylesheet" href="css/loading-states-improved.css?v=3.0">
    <link rel="stylesheet" href="css/micro-interactions.css?v=3.0">
    <link rel="stylesheet" href="css/pages-common.css?v=3.0">
    <link rel="stylesheet" href="css/responsive.css?v=3.0">
    <link rel="stylesheet" href="css/notifications.css?v=3.0">
    <link rel="stylesheet" href="css/animations.css?v=3.0">
    <link rel="stylesheet" href="css/components-enhanced.css?v=3.0">

    <!-- CSS Específicos de Página -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/products-page.css">
    <link rel="stylesheet" href="css/product-cards.css?v=2.0">
    <link rel="stylesheet" href="css/quick-view.css?v=1.0">
    <link rel="stylesheet" href="css/comparator.css?v=1.0">
    <link rel="stylesheet" href="css/breadcrumbs.css?v=1.0">
    <link rel="stylesheet" href="css/recently-viewed.css?v=1.0">
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <!-- Breadcrumbs -->
    <nav id="breadcrumbs"></nav>

    <!-- Products Page -->
    <div class="products-page">
        <div class="products-hero">
            <div class="container">
                <div class="products-hero-card">
                    <span class="products-hero-eyebrow"><i class="fas fa-th-large"></i> Catálogo SneakersShop</span>
                    <h1 class="products-hero-title">Nuestra Colección</h1>
                    <p class="products-hero-description">Explora los últimos lanzamientos, ediciones limitadas y
                        clásicos atemporales. Encuentra tu par perfecto.</p>
                    <div class="products-hero-actions">
                        <button type="button" class="btn btn-primary btn-sm" onclick="scrollToFilters()">
                            <i class="fas fa-sliders-h"></i> Explorar filtros
                        </button>
                        <button type="button" class="btn btn-outline btn-sm"
                            onclick="window.location.href='compare.html'">
                            <i class="fas fa-balance-scale"></i> Ir al comparador
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <!-- Filters -->
            <div class="products-filters">
                <div class="filters-row">
                    <div class="filter-group">
                        <label>Buscar Producto</label>
                        <input type="text" id="searchFilter" placeholder="Buscar por nombre...">
                    </div>
                    <div class="filter-group">
                        <label>Categoría</label>
                        <select id="categoryFilter">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Marca</label>
                        <select id="brandFilter">
                            <option value="">Todas las marcas</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Silueta</label>
                        <select id="silhouetteFilter">
                            <option value="">Todas</option>
                            <option value="High">High</option>
                            <option value="Mid">Mid</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Año</label>
                        <select id="yearFilter">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Talla (US)</label>
                        <select id="sizeFilter">
                            <option value="">Todas</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Precio</label>
                        <div class="price-range">
                            <input type="number" id="minPrice" placeholder="Min" min="0">
                            <span>-</span>
                            <input type="number" id="maxPrice" placeholder="Max" min="0">
                        </div>
                    </div>
                </div>
                <div class="filter-actions d-flex gap-md">
                    <button class="btn btn-outline" onclick="resetFilters()">
                        <i class="fas fa-redo"></i> Limpiar
                    </button>
                    <button class="btn btn-primary" onclick="applyFilters()">
                        <i class="fas fa-filter"></i> Aplicar Filtros
                    </button>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="products-header-bar">
                <div class="products-count" id="productsCount" role="status" aria-live="polite">Cargando...</div>
                <div class="products-header-actions">
                    <select class="sort-select" id="sortSelect" onchange="applySort()" aria-label="Ordenar productos">
                        <option value="name-asc">Nombre A-Z</option>
                        <option value="name-desc">Nombre Z-A</option>
                        <option value="price-asc">Precio: Menor a Mayor</option>
                        <option value="price-desc">Precio: Mayor a Menor</option>
                        <option value="rating-desc">Mejor valorados</option>
                        <option value="newest">Más recientes</option>
                    </select>
                </div>
            </div>

            <!-- Products Grid -->
            <div id="productsContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Cargando productos...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <section id="recentlyViewedProductsSection" class="recently-viewed-section" data-recently-viewed-section
        style="display:none;">
        <div class="container">
            <div class="section-header">
                <h2><i class="fas fa-history"></i> Tu historial de productos</h2>
                <button type="button" class="recently-viewed-clear" id="clearRecentlyViewedProductsBtn">
                    <i class="fas fa-times"></i> Limpiar historial
                </button>
            </div>
            <div id="recentlyViewedGridProducts" class="recently-viewed-grid"
                data-section="#recentlyViewedProductsSection"></div>
        </div>
    </section>

    <!-- Scripts -->
    <!-- Scripts del Sistema Integrado -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/components.js"></script>
    <script src="js/comparator.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/recently-viewed.js"></script>
    <script src="js/quick-view.js"></script>
    <script src="js/breadcrumbs.js"></script>

    <script src="js/products.js"></script>
</body>

</html>
