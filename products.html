<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Exclusivo - SneakersShop | Jordan, Yeezy, Nike</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Explora nuestra colección exclusiva de sneakers y streetwear. Los últimos lanzamientos de Jordan, Yeezy, Nike, Adidas y más. Envíos a todo el Perú.">
    <meta name="keywords"
        content="zapatillas, sneakers, catalogo, tienda online, peru, lima, comprar zapatillas, nike, jordan, yeezy, adidas">
    <meta name="author" content="SneakersShop">
    <meta name="robots" content="index, follow">
    <meta name="revisit-after" content="7 days">

    <!-- Open Graph -->
    <meta property="og:title" content="Catálogo Exclusivo - SneakersShop">
    <meta property="og:description"
        content="Encuentra tu par perfecto. La mejor selección de sneakers originales en Perú.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="http://localhost:8080/products.html">
    <meta property="og:image" content="http://localhost:8080/assets/images/banners/hero-banner.jpg">
    <meta property="og:locale" content="es_PE">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Catálogo Exclusivo - SneakersShop">
    <meta name="twitter:description"
        content="Encuentra tu par perfecto. La mejor selección de sneakers originales en Perú.">
    <meta name="twitter:image" content="http://localhost:8080/assets/images/banners/hero-banner.jpg">

    <!-- Canonical -->
    <link rel="canonical" href="http://localhost:8080/products.html">
    <!-- Google Fonts - Fuentes Profesionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CSS Unificado (Streetwear Standard V3) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/product-cards.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/skeleton.css?v=7.0-CLEAN">

    <!-- Utilities -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Page Specific -->
    <link rel="stylesheet" href="css/products-streetwear.css?v=7.0-CLEAN">
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <!-- Breadcrumbs -->
    <nav id="breadcrumbs"></nav>

    <!-- 🚀 V3 CATALOG: BRUTALIST ENGINE -->
    <div class="products-page">
        <!-- Brutalist Header -->
        <div class="container"
            style="margin-top: 4rem; margin-bottom: 2rem; border-bottom: 4px solid var(--black); padding-bottom: 1rem;">
            <div class="d-flex justify-content-between align-items-end flex-wrap gap-4">
                <div>
                    <span class="text-uppercase fw-bold" style="letter-spacing: 2px;">Catalog v3.0</span>
                    <h1
                        style="font-size: 4rem; line-height: 0.9; margin: 0; text-transform: uppercase; font-weight: 900;">
                        ALL ACCESS</h1>
                </div>
                <div class="catalog-stats fw-bold">
                    <span id="productCount">0</span> ITEMS LOADED
                </div>
            </div>
        </div>

        <div class="container">
            <!-- V3 Controls -->
            <div class="catalog-controls"
                style="margin-bottom: 2rem; display: flex; gap: 1rem; border: 2px solid var(--black); padding: 1rem;">
                <button class="btn-filter" onclick="window.catalogEngine.filter('all')">ALL</button>
                <button class="btn-filter" onclick="window.catalogEngine.filter('jordan')">JORDAN</button>
                <button class="btn-filter" onclick="window.catalogEngine.filter('yeezy')">YEEZY</button>
                <button class="btn-filter" onclick="window.catalogEngine.filter('nike')">NIKE</button>
                <div style="margin-left: auto;">
                    <select id="sortSelect" class="brutalist-select" onchange="window.catalogEngine.sort(this.value)">
                        <option value="newest">LATEST DROP</option>
                        <option value="price-asc">CHEAPEST</option>
                        <option value="price-desc">MOST HYPE</option>
                    </select>
                </div>
            </div>

            <!-- V3 Grid -->
            <div id="productsContainer" class="product-grid-v3"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; min-height: 50vh;">
                <!-- Injected by CatalogEngine -->
                <div class="loading-brutalist">LOADING DATA...</div>
            </div>

            <!-- Pagination (mock) -->
            <div class="pagination-brutalist"
                style="margin-top: 4rem; display: flex; justify-content: center; gap: 1rem;">
                <button class="btn btn-outline" disabled>PREV</button>
                <button class="btn btn-black">1</button>
                <button class="btn btn-outline">2</button>
                <button class="btn btn-outline">NEXT</button>
            </div>
        </div>
    </div>

    <section id="recentlyViewedProductsSection" class="recently-viewed-section" data-recently-viewed-section
        style="display:none;">
        <div class="container">
            <div class="section-header">
                <h2><i class="fas fa-history"></i> Tu historial de productos</h2>
                <button type="button" class="recently-viewed-clear" id="clearRecentlyViewedProductsBtn">
                    <i class="fas fa-times"></i> Limpiar historial
                </button>
            </div>
            <div id="recentlyViewedGridProducts" class="recently-viewed-grid"
                data-section="#recentlyViewedProductsSection"></div>
        </div>
    </section>

    <!-- Scripts -->
    <!-- Footer (Will be injected by JS) -->
    <footer id="mainFooter"></footer>

    <!-- Scripts del Sistema Integrado -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script> <!-- Vital for Header/Footer -->
    <script src="js/notifications.js"></script>
    <script src="js/cart.js"></script>

    <!-- Catalog Engine -->
    <script src="js/products.js"></script>

    <script>
        // Init Globals immediately like Home
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Components) {
                const header = document.getElementById('mainHeader');
                if (header && !header.innerHTML.trim()) {
                    header.innerHTML = window.Components.getHeader(true, true);
                    if (window.Components.initHeader) window.Components.initHeader();
                }
                const footer = document.getElementById('mainFooter');
                if (footer && !footer.innerHTML.trim()) {
                    footer.innerHTML = window.Components.getFooter();
                }
            }
        });
    </script>
</body>

</html>
