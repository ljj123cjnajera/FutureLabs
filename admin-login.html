<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - SneakersShop | Restricted Access</title>
    <!-- SEO Meta Tags -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CORE STYLES (V7) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/animations.css?v=7.0-CLEAN">

    <!-- PAGE SPECIFIC -->
    <link rel="stylesheet" href="css/auth-brutalist.css?v=7.0-CLEAN">
    <style>
        .auth-container {
            border-color: var(--highlight);
            box-shadow: 12px 12px 0 var(--highlight);
        }

        .auth-container:hover {
            box-shadow: 16px 16px 0 var(--highlight);
        }

        .btn-auth {
            background: var(--highlight);
            color: var(--black);
        }

        .btn-auth:hover {
            box-shadow: 4px 4px 0 var(--black);
        }
    </style>
</head>

<body>
    <!-- Header Placeholder (Minimal) -->
    <div
        style="background: var(--black); color: var(--white); padding: 1rem; text-align: center; font-weight: 900; letter-spacing: 2px;">
        COMMAND CENTER
    </div>

    <div class="container">
        <div class="auth-container">
            <h1 class="auth-title">ADMIN ACCESS</h1>
            <p style="margin-bottom: 2rem; color: var(--gray-600); font-weight: 600;">AUTHORIZED PERSONNEL ONLY</p>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Admin Email</label>
                    <input type="email" id="email" class="form-input" required placeholder="admin@futurelabs.com"
                        autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Security Key</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>

                <div id="loginAlert"
                    style="display: none; padding: 1rem; background: #ffebee; color: #c62828; font-weight: 600; border: 2px solid #c62828;">
                </div>

                <button type="submit" class="btn-auth">Initialize Session <i class="fas fa-terminal"></i></button>
            </form>

            <div class="auth-links" style="justify-content: center;">
                <a href="index.html" class="auth-link">Exit to Storefront</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const alertBox = document.getElementById('loginAlert');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const btn = form.querySelector('button');
                const originalBtnText = btn.innerHTML;

                // Loading State
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AUTHENTICATING...';
                btn.disabled = true;

                try {
                    // Hacer login directamente con la API
                    const response = await window.api.login(email, password);

                    if (response.success) {
                        const user = response.data.user;

                        // Verificar rol
                        if (user.role === 'admin' || user.role === 'moderator') {
                            // Guardar token en localStorage
                            localStorage.setItem('auth_token', response.data.token);
                            console.log('✅ Token guardado en localStorage');

                            // Guardar información del usuario en localStorage para admin.html
                            localStorage.setItem('admin_user', JSON.stringify({
                                id: user.id,
                                email: user.email,
                                first_name: user.first_name,
                                last_name: user.last_name,
                                role: user.role
                            }));

                            alertBox.style.display = 'block';
                            alertBox.style.background = '#e8f5e9';
                            alertBox.style.color = '#2e7d32';
                            alertBox.style.borderColor = '#2e7d32';
                            alertBox.textContent = 'ACCESS GRANTED. REDIRECTING...';

                            // Redirigir al panel admin
                            setTimeout(() => {
                                window.location.href = 'admin.html';
                            }, 1000);
                        } else {
                            throw new Error('Insufficient Privileges. Admin Role Required.');
                        }
                    } else {
                        throw new Error(response.message || 'Authentication Failed');
                    }
                } catch (error) {
                    console.error('Login Error:', error);
                    alertBox.style.display = 'block';
                    alertBox.style.background = '#ffebee';
                    alertBox.style.color = '#c62828';
                    alertBox.style.borderColor = '#c62828';
                    alertBox.textContent = 'ACCESS DENIED: ' + error.message;

                    // Shake animation
                    const inputs = form.querySelectorAll('.form-input');
                    inputs.forEach(input => {
                        input.classList.add('input-shake');
                        setTimeout(() => input.classList.remove('input-shake'), 300);
                    });
                } finally {
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
