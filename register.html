<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | Sneakers Shop</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Únete a SneakersShop. Acceso exclusivo a drops, descuentos y envío prioritario.">
    <meta name="robots" content="index, follow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CORE STYLES (V7) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/animations.css?v=7.0-CLEAN">

    <!-- PAGE SPECIFIC -->
    <link rel="stylesheet" href="css/auth-brutalist.css?v=7.0-CLEAN">
</head>

<body>
    <header id="mainHeader"></header>

    <div class="container">
        <div class="auth-container">
            <h1 class="auth-title">ÚNETE AL CLUB</h1>
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="registerFirstName">Nombre</label>
                    <input type="text" id="registerFirstName" name="first_name" class="form-input" required placeholder="JUAN" autocomplete="given-name" aria-label="Nombre">
                </div>
                <div class="form-group">
                    <label class="form-label" for="registerLastName">Apellido</label>
                    <input type="text" id="registerLastName" name="last_name" class="form-input" required placeholder="PÉREZ" autocomplete="family-name" aria-label="Apellido">
                </div>
                <div class="form-group">
                    <label class="form-label" for="registerEmail">Correo Electrónico</label>
                    <input type="email" id="registerEmail" name="email" class="form-input" required placeholder="TU@EMAIL.COM" autocomplete="email" aria-label="Correo electrónico">
                </div>
                <div class="form-group">
                    <label class="form-label" for="registerPassword">Contraseña</label>
                    <input type="password" id="registerPassword" name="password" class="form-input" required placeholder="••••••••" autocomplete="new-password" aria-label="Contraseña" minlength="6">
                    <small style="display: block; margin-top: 5px; color: #666; font-size: 0.85rem;">Mínimo 6 caracteres</small>
                </div>

                <button type="submit" class="btn-auth" aria-label="Crear cuenta">CREAR CUENTA</button>
            </form>

            <div class="auth-links" style="justify-content: center;">
                <span>¿Ya eres miembro? <a href="login.html" class="auth-link">Iniciar Sesión</a></span>
            </div>
        </div>
    </div>

    <!-- Scripts (V7) -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/components.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
