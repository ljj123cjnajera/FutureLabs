<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN BLOG // FUTURELABS</title>

    <!-- CSS Core -->
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/grids.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/notifications.css">
    <!-- Admin Specific CSS -->
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .admin-sidebar {
            background: var(--black);
            color: var(--white);
            padding: 40px 20px;
        }

        .admin-menu {
            list-style: none;
            padding: 0;
            margin-top: 60px;
        }

        .admin-menu li {
            margin-bottom: 20px;
        }

        .admin-menu a {
            color: #888;
            text-decoration: none;
            font-family: 'Koulen';
            font-size: 1.5rem;
            text-transform: uppercase;
            display: block;
            transition: 0.3s;
        }

        .admin-menu a:hover,
        .admin-menu a.active {
            color: var(--white);
            padding-left: 10px;
            border-left: 4px solid var(--white);
        }

        .admin-content {
            padding: 60px;
            background: var(--gray-100);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 4px solid var(--black);
            padding-bottom: 20px;
        }

        /* Table Brutalist */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Space Mono', monospace;
            background: var(--white);
            border: 2px solid var(--black);
        }

        .admin-table th {
            background: var(--black);
            color: var(--white);
            text-align: left;
            padding: 15px;
            text-transform: uppercase;
        }

        .admin-table td {
            padding: 15px;
            border-bottom: 1px solid #ccc;
        }

        .admin-table tr:hover {
            background: #f0f0f0;
        }

        /* Actions */
        .btn-action {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            margin-right: 10px;
            transition: transform 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.2);
        }

        .btn-edit {
            color: blue;
        }

        .btn-delete {
            color: red;
        }

        .btn-view {
            color: green;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border: 4px solid black;
            width: 800px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border: 1px solid black;
            font-weight: bold;
            font-size: 12px;
        }

        .badge-success {
            background: #cfc;
            color: #050;
        }

        .badge-warning {
            background: #ffeeba;
            color: #856404;
        }
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Koulen&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <h1 style="font-family: 'Koulen'; font-size: 2rem; line-height: 1;">FUTURELABS<br><span
                    style="color: #666; font-size: 1rem;">ADMIN CONSOLE</span></h1>

            <ul class="admin-menu">
                <li><a href="admin.html">DASHBOARD</a></li>
                <li><a href="admin-products.html">PRODUCTS</a></li>
                <li><a href="admin-orders.html">ORDERS</a></li>
                <li><a href="admin-coupons.html">COUPONS</a></li>
                <li><a href="admin-blog.html" class="active">BLOG</a></li>
                <li><a href="index.html" style="margin-top: 40px; font-size: 1rem;"><i class="fas fa-arrow-left"></i>
                        EXIT</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-header">
                <div>
                    <h2 class="section-title" style="margin:0;">BLOG MANAGEMENT</h2>
                    <p style="margin:0; color: #666;">Create and manage news & articles.</p>
                </div>
                <button class="btn btn-black" onclick="window.adminBlog.openModal()">
                    <i class="fas fa-plus"></i> NEW POST
                </button>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Title / Slug</th>
                            <th>Author</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="blogTable">
                        <!-- Injected by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="blogModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="window.adminBlog.closeModal()">&times;</span>
            <h2 id="blogModalTitle" style="font-family: 'Koulen'; margin-bottom: 20px;">CREATE ENTRY</h2>

            <form id="blogForm">
                <input type="hidden" id="blogId">

                <div class="form-group">
                    <label>TITLE</label>
                    <input type="text" id="blogTitle" required placeholder="Article Title" style="font-weight: 700;">
                </div>

                <div class="form-group">
                    <label>SLUG (URL FRIENDLY)</label>
                    <input type="text" id="blogSlug" required placeholder="article-title-url">
                </div>

                <div class="form-group">
                    <label>COVER IMAGE</label>
                    <input type="file" id="blogImageFile" accept="image/*"
                        onchange="window.adminBlog.previewImage(this)">
                    <div id="blogImagePreviewContainer" style="margin-top: 10px; display: none;">
                        <p id="blogImageFileName" style="font-size: 0.8rem; color: #666;"></p>
                        <img id="blogPreviewImage" src="" style="max-height: 200px; border: 2px solid black;">
                    </div>
                </div>

                <div class="form-group">
                    <label>EXCERPT (SHORT SUMMARY)</label>
                    <textarea id="blogExcerpt" rows="2"
                        style="width: 100%; border: 2px solid black; padding: 10px;"></textarea>
                </div>

                <div class="form-group">
                    <label>CONTENT (MARKDOWN/HTML)</label>
                    <textarea id="blogContent" required rows="10"
                        style="width: 100%; border: 2px solid black; padding: 10px; font-family: monospace;"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label>AUTHOR</label>
                        <input type="text" id="blogAuthor" value="Admin">
                    </div>
                    <div class="form-group half">
                        <label>STATUS</label>
                        <select id="blogStatus">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                </div>

                <div style="margin-top: 30px; display: flex; gap: 10px;">
                    <button type="button" class="btn btn-outline" style="flex:1"
                        onclick="window.adminBlog.closeModal()">CANCEL</button>
                    <button type="submit" class="btn btn-black" style="flex:1">SAVE POST</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/notifications.js"></script>
    <script>
        // Init logic for admin
        document.addEventListener('DOMContentLoaded', () => {
            if (window.adminBlog) {
                window.adminBlog.loadPosts();
            }
        });
    </script>
    <script src="js/admin-blog.js"></script>
</body>

</html>
