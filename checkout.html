<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Seguro - SneakersShop | Detalles de Envío</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Proceso de pago seguro en SneakersShop. Envíos a todo el Perú. Completa tu orden hoy.">
    <meta name="robots" content="noindex, nofollow"> <!-- Don't index checkout -->

    <!-- Open Graph -->
    <meta property="og:title" content="Checkout Seguro - SneakersShop">
    <meta property="og:description" content="Completa tu compra de forma segura.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="http://localhost:8080/checkout.html">

    <!-- Canonical -->
    <link rel="canonical" href="http://localhost:8080/checkout.html">
    <!-- Google Fonts - Fuentes Profesionales -->
    <!-- Google Fonts - Fuentes Profesionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Unificado (Streetwear Standard V3) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">

    <!-- PAGE SPECIFIC (The Final Step) -->
    <link rel="stylesheet" href="css/checkout-brutalist.css?v=7.0-CLEAN">
</head>

<body>
    <!-- Header -->
    <!-- Checkout Header (Isolation Mode) -->
    <header class="checkout-header"
        style="border-bottom: 4px solid var(--black); padding: 20px 0; background: var(--white);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="logo"
                style="font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 1.5rem; text-decoration: none; color: var(--black); letter-spacing: -1px;">
                FUTURE<span style="color: var(--gray-400);">LABS</span>
            </a>
            <div class="secure-badge"
                style="display: flex; align-items: center; gap: 8px; color: #27ae60; font-weight: 700; font-family: 'Inter', sans-serif; font-size: 0.9rem;">
                <i class="fas fa-lock"></i> CHECKOUT SEGURO 256-BIT
            </div>
        </div>
    </header>

    <div class="checkout-page">
        <!-- Brutalist Title -->
        <div class="container"
            style="margin-bottom: 2rem; border-bottom: 4px solid var(--black); padding-bottom: 1rem;">
            <h1 style="font-size: 3rem; line-height: 1; margin: 0; text-transform: uppercase; font-weight: 900;">SECURE
                CHECKOUT</h1>
            <div
                style="font-family: 'Inter', sans-serif; color: #666; font-size: 0.9rem; margin-top: 0.5rem; display: flex; align-items: center; gap: 10px;">
                <span><i class="fas fa-shield-alt" style="color: #27ae60;"></i> PAGO ENCRIPTADO</span>
                <span><i class="fas fa-check-circle" style="color: #27ae60;"></i> GARANTÍA DE SATISFACCIÓN</span>
            </div>
        </div>

        <div class="container">
            <!-- Progress Bar -->
            <div class="checkout-progress" id="checkoutProgress">
                <div class="step active" data-step="1">
                    <div class="step-number">1</div>
                    <div class="step-label">SHIPPING</div>
                </div>
                <div class="step" data-step="2">
                    <div class="step-number">2</div>
                    <div class="step-label">PAYMENT</div>
                </div>
                <div class="step" data-step="3">
                    <div class="step-number">3</div>
                    <div class="step-label">REVIEW</div>
                </div>
                <div class="step" data-step="4">
                    <div class="step-number">4</div>
                    <div class="step-label">CONFIRM</div>
                </div>
            </div>

            <!-- Main Grid -->
            <div class="checkout-container">
                <!-- Left Column: Forms -->
                <div class="checkout-content" id="checkoutContent">
                    <div style="text-align: center; padding: 100px;">
                        <div class="loading-brutalist">LOADING SECURE SERVER...</div>
                    </div>
                </div>

                <!-- Right Column: Summary (Sticky in CSS) -->
                <div class="order-summary-box" id="orderSummary">
                    <div class="loading-brutalist">LOADING CART...</div>
                </div>
            </div>

            <!-- Navigation Actions (Moved outside grid for mobile flow or kept inside? JS appends them. Let's keep a container just in case) -->
            <div class="checkout-navigation" id="checkoutNavigation"
                style="display: none; margin-top: 2rem; border-top: 2px solid var(--black); padding-top: 2rem; justify-content: space-between;">
                <button class="btn btn-outline" id="btnPrevious"
                    style="padding: 1rem 2rem; font-weight: 700;">BACK</button>
                <button class="btn btn-black" id="btnNext"
                    style="padding: 1rem 2rem; font-weight: 700;">CONTINUE</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Scripts del Sistema Integrado -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/coupons.js"></script>
    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="js/checkout.js"></script>
    <script src="js/components.js"></script>

    <script>
        // Checkout Specific Logic (No Dynamic Header)
        document.addEventListener('DOMContentLoaded', function () {
            // Isolation Mode: No dynamic header/footer injection for checkout
            console.log('Secure Checkout Initialized');
        });

        function scrollToOrderSummary() {
            const summary = document.getElementById('orderSummary');
            if (summary) {
                summary.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    </script>
</body>

</html>
