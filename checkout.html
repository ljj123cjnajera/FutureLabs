<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Seguro - SneakersShop | Detalles de Envío</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Proceso de pago seguro en SneakersShop. Envíos a todo el Perú. Completa tu orden hoy.">
    <meta name="robots" content="noindex, nofollow"> <!-- Don't index checkout -->

    <!-- Open Graph -->
    <meta property="og:title" content="Checkout Seguro - SneakersShop">
    <meta property="og:description" content="Completa tu compra de forma segura.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ljj123cjnajera.github.io/FutureLabs/checkout.html">

    <!-- Canonical -->
    <link rel="canonical" href="https://ljj123cjnajera.github.io/FutureLabs/checkout.html">
    <!-- Google Fonts - Fuentes Profesionales -->
    <!-- Google Fonts - Fuentes Profesionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Unificado (Streetwear Standard V3) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">

    <!-- PAGE SPECIFIC (The Final Step) -->
    <link rel="stylesheet" href="css/checkout-brutalist.css?v=7.0-CLEAN">
</head>

<body>
    <!-- Header -->
    <!-- Checkout Header (Isolation Mode) -->
    <header class="checkout-header">
        <div class="container checkout-header-inner">
            <a href="index.html" class="checkout-logo">
                FUTURE<span>LABS</span>
            </a>
            <div class="secure-badge">
                <i class="fas fa-lock" aria-hidden="true"></i> CHECKOUT SEGURO 256-BIT
            </div>
        </div>
    </header>


    <div class="checkout-page">
        <!-- Brutalist Title -->
        <!-- Brutalist Title -->
        <div class="container checkout-title-container">
            <h1 class="checkout-main-title">CHECKOUT
                SEGURO</h1>
            <div class="checkout-trust-row">
                <span><i class="fas fa-shield-alt checkout-trust-icon" aria-hidden="true"></i> PAGO ENCRIPTADO SSL 256-BIT</span>
                <span><i class="fas fa-check-circle checkout-trust-icon" aria-hidden="true"></i> GARANTÍA DE SATISFACCIÓN 100%</span>
                <span><i class="fas fa-truck checkout-trust-icon" aria-hidden="true"></i> ENVÍO GRATIS +S/150</span>
                <span><i class="fas fa-undo checkout-trust-icon" aria-hidden="true"></i> DEVOLUCIÓN GRATIS 30 DÍAS</span>
            </div>
        </div>


        <div class="container">
            <!-- Progress Bar -->
            <div class="checkout-progress" id="checkoutProgress">
                <div class="step active" data-step="1" aria-current="step">
                    <div class="step-number">1</div>
                    <div class="step-label">ENVÍO</div>
                </div>
                <div class="step" data-step="2">
                    <div class="step-number">2</div>
                    <div class="step-label">PAGO</div>
                </div>
                <div class="step" data-step="3">
                    <div class="step-number">3</div>
                    <div class="step-label">REVISAR</div>
                </div>
                <div class="step" data-step="4">
                    <div class="step-number">4</div>
                    <div class="step-label">CONFIRMAR</div>
                </div>
            </div>

            <!-- Main Grid -->
            <div class="checkout-container">
                <!-- Left Column: Forms -->
                <div class="checkout-content" id="checkoutContent">
                    <div style="text-align: center; padding: 100px;" role="status" aria-live="polite">
                        <div class="loading-brutalist">CARGANDO SERVIDOR SEGURO...</div>
                    </div>
                </div>

                <!-- Right Column: Summary (Sticky in CSS) -->
                <div class="order-summary-box" id="orderSummary" role="complementary" aria-label="Resumen del pedido">
                    <div class="loading-brutalist">CARGANDO CARRITO...</div>
                </div>
            </div>

            <!-- Navigation Actions (Moved outside grid for mobile flow or kept inside? JS appends them. Let's keep a container just in case) -->
            <!-- Navigation Actions (Moved outside grid for mobile flow or kept inside? JS appends them. Let's keep a container just in case) -->
            <div class="checkout-navigation checkout-nav-container" id="checkoutNavigation">
                <button class="btn btn-outline btn-nav" id="btnPrevious">BACK</button>
                <button class="btn btn-black btn-nav" id="btnNext">CONTINUE</button>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <!-- Scripts del Sistema Integrado -->
    <script src="js/logger.js?v=1.0"></script>
    <script src="js/error-handler.js?v=1.0"></script>
    <script src="js/loading-states.js?v=1.0"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/navigation-enhanced.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/coupons.js"></script>
    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="js/checkout.js"></script>

    <!-- Logic merged into js/checkout.js -->

    <!-- Footer -->
    <footer id="mainFooter" role="contentinfo"></footer>
</body>

</html>
