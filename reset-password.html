<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - SneakersShop</title>

    <!-- CSS Unificado (V7) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/auth-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/notifications.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/animations.css?v=7.0-CLEAN">
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <div class="reset-page">
        <div class="reset-container">
            <div class="reset-header">
                <h1><i class="fas fa-lock"></i> Restablecer Contraseña</h1>
                <p>Ingresa tu nueva contraseña</p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label>Token de Recuperación</label>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="text" id="token" required autofocus placeholder="Token de recuperación">
                    </div>
                </div>

                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" required placeholder="Repite la contraseña">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-check"></i> Restablecer Contraseña
                </button>
            </form>

            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
            </div>
        </div>
    </div>

    <footer id="mainFooter"></footer>

    <!-- Scripts -->
    <!-- Core scripts (critical for page functionality) -->
    <script src="js/logger.js?v=1.0"></script>
    <script src="js/error-handler.js?v=1.0"></script>
    <script src="js/loading-states.js?v=1.0"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/navigation-enhanced.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <!-- Page-specific script -->
    <script src="js/reset-password.js"></script>
</body>

</html>
