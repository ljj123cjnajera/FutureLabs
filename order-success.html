<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Sneakers Shop</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Poppins:wght@600;700;900&display=swap" rel="stylesheet">

    <!-- PRIMARY SOURCE OF TRUTH - LOAD ORDER MATTERS -->
    <link rel="stylesheet" href="css/typography.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/home-streetwear.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/autocomplete.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/header-v3.css?v=8.0-URGENT">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/order-success.css?v=8.0-URGENT">
</head>

<body>
    <!-- HEADER (Injected) -->
    <header id="mainHeader"></header>

    <main class="success-container">
        <div class="success-icon-wrapper">
            <i class="fas fa-check-circle success-icon"></i>
        </div>

        <h1 style="font-size: 3rem; line-height: 1; margin-bottom: 1rem; text-transform: uppercase;">
            Pedido Confirmado
        </h1>

        <p style="font-size: 1.2rem; color: var(--gray-600); max-width: 400px; margin: 0 auto;">
            Gracias por tu compra. Hemos enviado un correo de confirmación a <span id="customerEmail"
                style="font-weight: 700;">tu email</span>.
        </p>

        <div id="orderIdContainer" style="display: none;">
            <div class="order-id-badge" id="orderIdDisplay">CARGANDO...</div>
        </div>

        <div class="success-actions">
            <a href="index.html" class="btn btn-outline">VOLVER AL INICIO</a>
            <a href="profile.html?tab=orders" class="btn btn-black" id="viewOrderBtn">VER PEDIDO</a>
        </div>

        <!-- Guest Upsell Section (Hidden initially) -->
        <div id="guestUpsell" style="display: none; margin-top: 3rem; border-top: 1px solid #eee; padding-top: 2rem;">
            <h3>¿Quieres rastrear tu pedido?</h3>
            <p style="color: var(--gray-600); margin-bottom: 1.5rem;">
                Crea una cuenta con <strong><span id="upsellEmail">tu email</span></strong> para guardar tu historial y
                recibir ofertas exclusivas.
            </p>
            <a href="register.html" id="registerLink" class="btn btn-outline">CREAR CUENTA</a>
        </div>
    </main>

    <!-- FOOTER (Injected) -->
    <footer id="mainFooter" role="contentinfo"></footer>

    <!-- SCRIPTS -->
    <!-- Core scripts (critical for page functionality) -->
    <script src="js/logger.js?v=1.0"></script>
    <script src="js/error-handler.js?v=1.0"></script>
    <script src="js/loading-states.js?v=1.0"></script>
    <script src="js/api.js?v=8.0-CLEAN"></script>
    <script src="js/components.js?v=8.0-CLEAN"></script>
    <script src="js/navigation-enhanced.js?v=8.0-CLEAN"></script>
    <script src="js/auth.js?v=8.0-CLEAN"></script>
    <script src="js/notifications.js?v=8.0-CLEAN"></script>
    <script src="js/cart.js?v=8.0-CLEAN"></script>
    <script src="js/wishlist.js?v=8.0-CLEAN"></script>
    <!-- Page-specific script -->
    <script src="js/order-success.js?v=8.0-CLEAN"></script>
</body>

</html>
