<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - SneakersShop | Compra 100% Segura</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Detalle del producto, especificaciones y precios. Compra zapatillas originales con garantía y seguridad en SneakersShop. Envíos rápidos.">
    <meta name="keywords" content="zapatillas, comprar, precio, oferta, original, garantia, peru, lima, sneakers shop">
    <meta name="author" content="SneakersShop">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Detalle de Producto - SneakersShop">
    <meta property="og:description"
        content="Descubre los detalles de este modelo exclusivo. Calidad premium y autenticidad garantizada.">
    <meta property="og:type" content="product">
    <meta property="og:url" content="http://localhost:8080/product-detail.html">
    <meta property="og:image" content="http://localhost:8080/assets/images/logo.png">
    <meta property="og:locale" content="es_PE">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Detalle de Producto - SneakersShop">
    <meta name="twitter:description"
        content="Descubre los detalles de este modelo exclusivo. Calidad premium y autenticidad garantizada.">
    <meta name="twitter:image" content="http://localhost:8080/assets/images/logo.png">

    <!-- Canonical -->
    <link rel="canonical" href="http://localhost:8080/product-detail.html">
    <!-- Google Fonts - Fuentes Profesionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CORE SYSTEM (V3 STANDARD) -->
    <!-- Base Styles (Reset, Variables, Typography handled here) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">

    <!-- COMPONENTS -->
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/skeleton.css?v=7.0-CLEAN">

    <!-- PAGE SPECIFIC (The Monolith) -->
    <link rel="stylesheet" href="css/pdp-brutalist.css?v=REVAMP">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Header Dinámico (V3) -->
    <header id="mainHeader"></header>

    <!-- Breadcrumbs -->
    <nav id="breadcrumbs"></nav>

    <!-- Product Detail Page -->
    <div class="product-detail-page">
        <div class="container">
            <div id="productDetailContainer">
                <div class="loading-detail">
                    <div class="loading-spinner large"></div>
                    <p>Cargando producto...</p>
                </div>
            </div>
        </div>

        <!-- Recently Viewed Section -->
        <section id="recentlyViewedSection" class="recently-viewed-section" data-recently-viewed-section
            style="display:none;">
            <div class="container">
                <div class="section-header">
                    <h2><i class="fas fa-eye"></i> Productos que viste recientemente</h2>
                    <button type="button" class="recently-viewed-clear" id="clearRecentlyViewedBtn">
                        <i class="fas fa-times"></i> Limpiar historial
                    </button>
                </div>
                <div id="recentlyViewedGrid" class="recently-viewed-grid" data-section="#recentlyViewedSection"></div>
            </div>
        </section>

        <!-- Reviews Section -->
        <section class="reviews-section">
            <div class="container">
                <div class="reviews-header">
                    <h2 class="reviews-title"><i class="fas fa-star"></i> Opiniones de clientes</h2>
                    <button class="btn btn-outline btn-sm" type="button" id="writeReviewBtn">
                        <i class="fas fa-pen"></i> Escribir review
                    </button>
                </div>
                <div class="product-meta-header">
                    <span class="product-brand" id="pdpBrand">LOADING...</span>
                    <div class="live-viewers-badge" id="liveViewers">
                        <span class="pulsing-dot"></span> <span id="viewerCount">14</span> personas viendo
                    </div>
                </div>

                <h1 class="product-title" id="pdpTitle">LOADING PRODUCT...</h1>

                <div class="product-price-block">
                    <span class="currency">S/</span>
                    <span class="price-value" id="pdpPrice">000.00</span>
                    <span class="stock-alert blink-text" id="stockAlert"
                        style="display:none; color: red; font-size: 0.9rem; margin-left: 10px; font-weight: 800;">¡SOLO
                        QUEDAN 2!</span>
                </div>

                <!-- Payment Trust (Local) -->
                <div class="payment-trust-mini">
                    <span><i class="fas fa-credit-card"></i> Tarjetas</span>
                    <span><i class="fas fa-mobile-alt"></i> Yape / Plin</span>
                    <span><i class="fas fa-shield-alt"></i> Compra Segura</span>
                </div>
                <div id="reviewsStats"></div>
                <div class="reviews-filters">
                    <div class="filter-group">
                        <span class="filter-label">Filtrar:</span>
                        <div class="filter-buttons" id="reviewsFilterButtons">
                            <button class="filter-btn active" type="button" data-review-filter="all">Todas</button>
                            <button class="filter-btn" type="button" data-review-filter="5">5 ★</button>
                            <button class="filter-btn" type="button" data-review-filter="4">4 ★</button>
                            <button class="filter-btn" type="button" data-review-filter="3">3 ★</button>
                            <button class="filter-btn" type="button" data-review-filter="2">2 ★</button>
                            <button class="filter-btn" type="button" data-review-filter="1">1 ★</button>
                            <button class="filter-btn" type="button" data-review-filter="with-photos">
                                <i class="fas fa-camera"></i> Con fotos
                            </button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">Ordenar:</span>
                        <select id="reviewsSortSelect" class="form-input" aria-label="Ordenar opiniones">
                            <option value="recent">Más recientes</option>
                            <option value="highest">Mejor calificados</option>
                            <option value="lowest">Peor calificados</option>
                            <option value="oldest">Más antiguos</option>
                        </select>
                    </div>
                </div>
                <div id="reviewFormContainer"></div>
                <div id="reviewsList"></div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <!-- Scripts del Sistema Integrado -->
    <script src="js/auth-guard.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/comparator.js"></script>
    <script src="js/recently-viewed.js"></script>
    <script src="js/reviews.js"></script>
    <script src="js/related-products.js"></script>
    <script src="js/components.js"></script>
    <script src="js/product-gallery.js"></script>
    <script src="js/breadcrumbs.js"></script>

    <script src="js/product-detail.js"></script>
</body>

</html>
