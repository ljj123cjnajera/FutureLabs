<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sneakers Shop</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Inicia sesión en SneakersShop. Accede a tu perfil, historial de pedidos y wishlist.">
    <meta name="robots" content="index, follow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PRIMARY SOURCE OF TRUTH - LOAD ORDER MATTERS -->
    <link rel="stylesheet" href="css/typography.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/home-streetwear.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/autocomplete.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/header-v3.css?v=8.0-URGENT">
    <link rel="stylesheet" href="css/animations.css?v=8.0-URGENT">

    <!-- PAGE SPECIFIC -->
    <link rel="stylesheet" href="css/auth-brutalist.css?v=8.0-URGENT">
</head>

<body>
    <header id="mainHeader"></header>

    <div class="container">
        <div class="auth-container">
            <h1 class="auth-title">ACCESO DE MIEMBRO</h1>
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail" name="email" class="form-input" required placeholder="TU@EMAIL.COM" autocomplete="email" aria-label="Correo electrónico">
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" name="password" class="form-input" required placeholder="••••••••" autocomplete="current-password" aria-label="Contraseña">
                </div>

                <button type="submit" class="btn-auth" aria-label="Iniciar sesión">INICIAR SESIÓN</button>
            </form>

            <div class="auth-links">
                <a href="register.html" class="auth-link">Crear Cuenta</a>
                <a href="forgot-password.html" class="auth-link">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="mainFooter" role="contentinfo"></footer>

    <!-- Scripts (V7) -->
    <!-- Core scripts (critical for page functionality) -->
    <script src="js/logger.js?v=1.0"></script>
    <script src="js/error-handler.js?v=1.0"></script>
    <script src="js/loading-states.js?v=1.0"></script>
    <script src="js/form-validator.js?v=1.0"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/navigation-enhanced.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <!-- Page-specific script -->
    <script src="js/login.js"></script>
</body>

</html>
