<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sneakers Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CORE STYLES -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=6.1">
    <link rel="stylesheet" href="css/header-v3.css?v=6.1">
    <link rel="stylesheet" href="css/animations.css">

    <style>
        .auth-container {
            max-width: 500px;
            margin: 8rem auto;
            padding: 3rem;
            border: 4px solid var(--black);
            text-align: center;
            background: #fff;
            box-shadow: 12px 12px 0 var(--black);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .auth-container:hover {
            transform: translate(-4px, -4px);
            box-shadow: 16px 16px 0 var(--black);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .input-shake {
            animation: shake 0.3s ease-in-out;
            border-color: var(--error) !important;
        }

        .auth-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            text-align: left;
        }

        .form-label {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--gray-300);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: var(--black);
            outline: none;
            box-shadow: 4px 4px 0 var(--gray-200);
        }

        .btn-auth {
            background: var(--black);
            color: var(--white);
            border: none;
            padding: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 1rem;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 var(--accent);
        }

        .auth-links {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .auth-link {
            text-decoration: underline;
            color: var(--gray-600);
        }

        .auth-link:hover {
            color: var(--black);
        }
    </style>
</head>

<body>
    <header id="mainHeader"></header>

    <div class="container">
        <div class="auth-container">
            <h1 class="auth-title">Member Access</h1>
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" required placeholder="TU@EMAIL.COM">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-auth">Sign In</button>
            </form>

            <div class="auth-links">
                <a href="register.html" class="auth-link">Create Account</a>
                <a href="forgot-password.html" class="auth-link">Forgot Password?</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/components.js?v=6.1"></script>
    <script src="js/auth.js?v=6.1"></script>
    <script src="js/notifications.js?v=6.1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Components) window.Components.initHeader();

            // Simple Auth Mock
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                // Simulate login
                localStorage.setItem('user_token', 'mock_token_123');
                window.location.href = 'profile.html';
            });
        });
    </script>
</body>

</html>
