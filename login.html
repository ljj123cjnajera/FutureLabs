<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sneakers Shop</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Inicia sesión en SneakersShop. Accede a tu perfil, historial de pedidos y wishlist.">
    <meta name="robots" content="index, follow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CORE STYLES (V7) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/animations.css?v=7.0-CLEAN">

    <!-- PAGE SPECIFIC -->
    <link rel="stylesheet" href="css/auth-brutalist.css?v=7.0-CLEAN">
</head>

<body>
    <header id="mainHeader"></header>

    <div class="container">
        <div class="auth-container">
            <h1 class="auth-title">Member Access</h1>
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" required placeholder="TU@EMAIL.COM">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-auth">Sign In</button>
            </form>

            <div class="auth-links">
                <a href="register.html" class="auth-link">Create Account</a>
                <a href="forgot-password.html" class="auth-link">Forgot Password?</a>
            </div>
        </div>
    </div>

    <!-- Scripts (V7) -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Components) window.Components.loadHeader();

            // Simple Auth Mock
            const form = document.getElementById('loginForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    // Simulate login
                    localStorage.setItem('user_token', 'mock_token_123');
                    window.location.href = 'profile.html';
                });
            }
        });
    </script>
</body>

</html>
