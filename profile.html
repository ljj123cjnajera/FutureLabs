<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - SneakersShop</title>
    <!-- Google Fonts - Fuentes Profesionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font Awesome -->
    <!-- CSS Unificado (Streetwear Standard V3) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=6.2">
    <link rel="stylesheet" href="css/header-v3.css?v=6.2">
    <link rel="stylesheet" href="css/account-brutalist.css?v=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <div class="account-container">
        <!-- SIDEBAR -->
        <aside class="account-sidebar">
            <div class="account-user-info">
                <div class="account-user-name" id="profileName">LOADING...</div>
                <div class="account-user-email" id="profileEmail">...</div>
            </div>

            <nav class="account-nav">
                <button class="account-nav-btn active" onclick="switchTab('overview')">
                    <i class="fas fa-th-large"></i> OVERVIEW
                </button>
                <button class="account-nav-btn" onclick="switchTab('orders')">
                    <i class="fas fa-box"></i> ORDERS
                </button>
                <button class="account-nav-btn" onclick="switchTab('addresses')">
                    <i class="fas fa-map-marker-alt"></i> ADDRESSES
                </button>
                <button class="account-nav-btn" onclick="switchTab('settings')">
                    <!-- <i class="fas fa-cog"></i> --> SETTINGS
                </button>
                <button class="account-nav-btn" onclick="window.authManager.logout()"
                    style="margin-top: 2rem; color: red; border-color: red;">
                    LOGOUT
                </button>
            </nav>
        </aside>

        <!-- CONTENT -->
        <main class="account-content">
            <!-- OVERVIEW SECTION -->
            <section id="overview" class="account-section active">
                <h1 class="section-title">DASHBOARD</h1>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">TOTAL SPENT</span>
                        <div class="stat-value" id="totalSpent">S/ 0</div>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">ORDERS</span>
                        <div class="stat-value" id="totalOrders">0</div>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">LOYALTY POINTS</span>
                        <div class="stat-value" id="loyaltyPointsValue">0</div>
                    </div>
                </div>

                <div style="border: 2px solid var(--black); padding: 2rem; text-align: center;">
                    <h3 style="font-weight: 800; text-transform: uppercase; margin-bottom: 1rem;">NEED HELP?</h3>
                    <p style="margin-bottom: 1.5rem;">Contact our support team for any issues with your orders.</p>
                    <button class="btn-save" onclick="window.location.href='mailto:support@sneakersshop.com'">CONTACT
                        SUPPORT</button>
                </div>
            </section>

            <!-- ORDERS SECTION -->
            <section id="orders" class="account-section">
                <h1 class="section-title">MY ORDERS</h1>
                <div id="ordersList">
                    <div style="padding: 2rem; border: 2px dashed #ccc; text-align: center;">NO ORDERS YET</div>
                </div>
            </section>

            <!-- ADDRESSES SECTION -->
            <section id="addresses" class="account-section">
                <h1 class="section-title">ADDRESSES</h1>
                <div class="brutalist-form">
                    <div style="padding: 1rem; background: #eee; font-family: monospace;">
                        TODO: Address Manager
                    </div>
                </div>
            </section>

            <!-- SETTINGS SECTION -->
            <section id="settings" class="account-section">
                <h1 class="section-title">SETTINGS</h1>
                <form class="brutalist-form" id="profileForm">
                    <div class="form-group">
                        <label>FULL NAME</label>
                        <input type="text" class="form-input" id="firstName">
                    </div>
                    <div class="form-group">
                        <label>EMAIL</label>
                        <input type="email" class="form-input" id="email" disabled style="background: #eee;">
                    </div>
                    <button type="button" class="btn-save">UPDATE PROFILE</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Script for Tab Switching (Inline for simplicity or moved to profile.js) -->
    <script>
        function switchTab(tabId) {
            // Hide all sections
            document.querySelectorAll('.account-section').forEach(el => el.classList.remove('active'));
            // Deactivate all nav buttons
            document.querySelectorAll('.account-nav-btn').forEach(el => el.classList.remove('active'));

            // Show target
            document.getElementById(tabId).classList.add('active');
            // Activate button (rough approximation, in real app use event.target or data attr)
            event.currentTarget.classList.add('active');
        }
    </script>

    <!-- Address Modal -->
    <div id="addressModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="addressModalTitle">Nueva Dirección</h3>
                <span class="modal-close" onclick="closeAddressModal()">&times;</span>
            </div>
            <form id="addressForm">
                <input type="hidden" id="addressId">
                <div class="form-group">
                    <label class="form-label">Tipo de Dirección</label>
                    <select class="form-select" id="addressType" required>
                        <option value="home">Casa</option>
                        <option value="work">Trabajo</option>
                        <option value="other">Otra</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-input" id="addressStreet" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Ciudad</label>
                        <input type="text" class="form-input" id="addressCity" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Región</label>
                        <input type="text" class="form-input" id="addressRegion" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Código Postal</label>
                        <input type="text" class="form-input" id="addressPostalCode">
                    </div>
                    <div class="form-group">
                        <label class="form-label">País</label>
                        <input type="text" class="form-input" id="addressCountry" value="Perú" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="addressIsDefault">
                        Establecer como dirección predeterminada
                    </label>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddressModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Dirección</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/components.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
