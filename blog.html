<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - SneakersShop | Streetwear Culture & News</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Descubre las últimas tendencias en sneakers, guías de estilo y noticias del mundo streetwear. Tu fuente de cultura hype en Perú.">
    <meta name="keywords"
        content="blog sneakers, noticias travis scott, yeezy news, jordan history, guia streetwear, peru zapatillas">
    <meta name="author" content="SneakersShop">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="SneakersShop Blog - Culture & Hype">
    <meta property="og:description"
        content="Noticias, lanzamientos y cultura sneaker. Mantente al día con lo último de Jordan, Yeezy y más.">
    <meta property="og:type" content="blog">
    <meta property="og:url" content="http://localhost:8080/blog.html">
    <meta property="og:image" content="http://localhost:8080/assets/images/banners/blog-hero.jpg">
    <meta property="og:locale" content="es_PE">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SneakersShop Blog - Culture & Hype">
    <meta name="twitter:description"
        content="Noticias, lanzamientos y cultura sneaker. Mantente al día con lo último de Jordan, Yeezy y más.">
    <meta name="twitter:image" content="http://localhost:8080/assets/images/banners/blog-hero.jpg">

    <!-- Canonical -->
    <link rel="canonical" href="http://localhost:8080/blog.html">

    <!-- Fonts Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CSS Unificado (Streetwear Standard V3) -->
    <link rel="stylesheet" href="css/home-streetwear.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/header-v3.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/footer-brutalist.css?v=7.0-CLEAN">
    <link rel="stylesheet" href="css/pages-brutalist.css?v=7.0-CLEAN">

    <!-- CSS Específicos de Página -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/blog-compare.css">
    <link rel="stylesheet" href="css/animations.css?v=7.0-CLEAN">
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <main class="blog-page">
        <section class="blog-hero">
            <div class="container">
                <div class="blog-hero-card">
                    <span class="blog-hero-eyebrow"><i class="fas fa-fire"></i> THE CULTURE & HYPE</span>
                    <h1 class="blog-hero-title">SNEAKER NEWS</h1>
                    <p class="blog-hero-description">Lanzamientos exclusivos, historias de diseño y guías de estilo para
                        tu rotación diaria.</p>
                    <div class="blog-hero-actions">
                        <button type="button" class="btn btn-primary btn-sm"
                            onclick="window.location.href='products.html'">
                            <i class="fas fa-shopping-bag"></i> Ver productos
                        </button>
                        <button type="button" class="btn btn-outline btn-sm"
                            onclick="window.location.href='compare.html'">
                            <i class="fas fa-balance-scale"></i> Comparar productos
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div class="container blog-container">
            <div id="blogContent" role="main" aria-live="polite" aria-busy="true">
                <div class="loading-state">
                    <div class="loading-state-content">
                        <div class="loading-spinner large" aria-hidden="true"></div>
                        <p>Cargando artículos...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="mainFooter"></footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/components.js"></script>

    <script src="js/blog.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Force Footer Injection
            const footer = document.getElementById('mainFooter');
            if (window.Components && footer) {
                footer.innerHTML = window.Components.getFooter();
            }
            // Force Header Injection
            if (window.Components && document.getElementById('mainHeader')) {
                document.getElementById('mainHeader').innerHTML = window.Components.getHeader(true, true);
                window.Components.initHeader();
                window.Components.initSearch();
                window.Components.initCartCounter();
            }
        });
    </script>
</body>

</html>
