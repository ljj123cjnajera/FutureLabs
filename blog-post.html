<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo - SneakersShop</title>

    <!-- CSS Unificado (V7 Brutalist Standard) -->
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/home-streetwear.css">
    <link rel="stylesheet" href="css/header-v3.css">
    <link rel="stylesheet" href="css/footer-brutalist.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/modals-improved.css">

    <!-- CSS Específicos de Página -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/pages-brutalist.css">
    <link rel="stylesheet" href="css/blog-compare.css">
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <main class="blog-page">
        <!-- Hero Section -->
        <section class="blog-hero" style="min-height: 400px; display: flex; align-items: center;">
            <div class="container">
                <div class="blog-hero-card">
                    <span class="blog-hero-eyebrow"><i class="fas fa-newspaper"></i> Blog</span>
                    <h1 class="blog-hero-title" id="postTitle">Cargando artículo...</h1>
                </div>
            </div>
        </section>

        <div class="container blog-container">
            <div id="blogPostContainer" style="max-width: 900px; margin: 0 auto;">
                <div class="loading-state">
                    <div class="loading-state-content">
                        <div class="loading-spinner large" aria-hidden="true"></div>
                        <p>Cargando contenido...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="mainFooter"></footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/components.js"></script>

    <script src="js/blog-post.js"></script>
</body>

</html>
