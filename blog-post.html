<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo - SneakersShop</title>

    <!-- CSS Unificado (Streetwear Standard) -->
    <link rel="stylesheet" href="css/typography.css?v=3.0">
    <link rel="stylesheet" href="css/style.css?v=3.0">
    <link rel="stylesheet" href="css/design-system.css?v=3.0">
    <link rel="stylesheet" href="css/header-improved.css?v=3.0">
    <link rel="stylesheet" href="css/footer-improved.css?v=3.0">
    <link rel="stylesheet" href="css/forms-improved.css?v=3.0">
    <link rel="stylesheet" href="css/modals-improved.css?v=3.0">
    <link rel="stylesheet" href="css/loading-states-improved.css?v=3.0">
    <link rel="stylesheet" href="css/micro-interactions.css?v=3.0">
    <link rel="stylesheet" href="css/pages-common.css?v=3.0">
    <link rel="stylesheet" href="css/responsive.css?v=3.0">
    <link rel="stylesheet" href="css/notifications.css?v=3.0">
    <link rel="stylesheet" href="css/animations.css?v=3.0">
    <link rel="stylesheet" href="css/components-enhanced.css?v=3.0">

    <!-- CSS Específicos de Página -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/informational-pages.css">
    <link rel="stylesheet" href="css/blog-compare.css">
    <link rel="stylesheet" href="css/animations-enhanced.css">
    <style>
        .blog-post-content {
            background: #fff;
            padding: 40px;
            border: 2px solid #000;
            margin-top: -60px;
            position: relative;
            z-index: 2;
            box-shadow: 8px 8px 0px #000;
        }

        .blog-post-header img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border: 2px solid #000;
        }

        .blog-meta-single {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .blog-body {
            line-height: 1.8;
            font-size: 1.1em;
            color: #333;
        }

        .blog-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
    </style>
</head>

<body>
    <!-- Header Dinámico -->
    <header id="mainHeader"></header>

    <main class="blog-page">
        <!-- Hero Section -->
        <section class="blog-hero" style="min-height: 400px; display: flex; align-items: center;">
            <div class="container">
                <div class="blog-hero-card">
                    <span class="blog-hero-eyebrow"><i class="fas fa-newspaper"></i> Blog</span>
                    <h1 class="blog-hero-title" id="postTitle">Cargando artículo...</h1>
                </div>
            </div>
        </section>

        <div class="container blog-container">
            <div id="blogPostContainer" style="max-width: 900px; margin: 0 auto;">
                <div class="loading-state">
                    <div class="loading-state-content">
                        <div class="loading-spinner large" aria-hidden="true"></div>
                        <p>Cargando contenido...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="mainFooter"></footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/components.js"></script>

    <script src="js/blog-post.js"></script>
</body>

</html>
