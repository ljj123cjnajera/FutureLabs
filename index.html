    <script>
        // Inicializar componentes cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function () {
            console.log('🚀 Inicializando SneakersShop...');

            // Renderizar header y footer
            const headerContainer = document.getElementById('mainHeader');
            const footerContainer = document.getElementById('mainFooter');

            if (headerContainer && window.Components) {
                headerContainer.innerHTML = window.Components.getHeader(true, true); // true = con barra de búsqueda, true = con navegación
                window.Components.initHeader();
                console.log('✅ Header renderizado');
            }

            if (footerContainer && window.Components) {
                footerContainer.innerHTML = window.Components.getFooter();
                console.log('✅ Footer renderizado');
            }

            // Inicializar contador de carrito
            if (window.Components) {
                window.Components.initCartCounter();
                console.log('✅ Contador de carrito inicializado');
            }

            // Inicializar búsqueda
            if (window.Components) {
                window.Components.initSearch();
            }

            // Inicializar modales
            if (window.modalManager) {
                console.log('✅ Modal manager inicializado');
            }

            // Inicializar autenticación
            if (window.authManager) {
                console.log('✅ Auth manager inicializado');
            }

            // Inicializar API
            if (window.api) {
                console.log('✅ API client inicializado');
            }

            // Inicializar megamenú (después de que homeManager cargue las categorías)
            // El megamenú se inicializará automáticamente cuando homeManager.loadMegaMenu() se ejecute
            // Pero también necesitamos inicializar los listeners básicos (abrir/cerrar)
            setTimeout(() => {
                if (window.initMegaMenu) {
                    window.initMegaMenu();
                }
            }, 1000);

            console.log('🎉 SneakersShop está listo!');
        });
    </script>
